<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="節酒アプリ NAMO">
<meta name="theme-color" content="#020b18">
<title>節酒アプリ NAMO - Smart Moderation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=DM+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#020b18;--bg2:#0d1b2e;--bg3:#1e293b;--border:#0e2740;
  --cyan:#22d3ee;--green:#34d399;--amber:#f59e0b;--red:#ef4444;
  --text:#f1f5f9;--muted:#64748b;--dim:#475569;
  --safe-top:env(safe-area-inset-top, 20px);
  --safe-bot:env(safe-area-inset-bottom, 20px);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',"Hiragino Kaku Gothic ProN",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:opacity .15s,transform .1s}
button:active{opacity:.7;transform:scale(.97)}
input,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
#header{padding:calc(var(--safe-top) + 8px) 20px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(14,39,64,.6);flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:16px 20px calc(var(--safe-bot) + 90px);-webkit-overflow-scrolling:touch}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateZ(0);width:100%;max-width:430px;background:rgba(2,11,24,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(14,39,64,.6);display:grid;grid-template-columns:repeat(2,1fr);padding:6px 0 calc(var(--safe-bot) + 12px);z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;opacity:.35;transition:opacity .2s}
.nav-btn.active{opacity:1}
.nav-btn .ni{font-size:19px;transition:transform .2s}
.nav-btn.active .ni{transform:translateY(-1px) scale(1.1)}
.nav-btn .nl{font-size:9px;color:var(--muted);font-weight:500}
.nav-btn.active .nl{color:var(--cyan);font-weight:700}
.card{background:var(--bg2);border-radius:18px;padding:18px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,.2);margin-bottom:16px}
.col{display:flex;flex-direction:column}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label-sm{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;font-weight:600}
.btn-cyan{background:linear-gradient(135deg,#0891b2,#0e7490);border-radius:14px;padding:14px 24px;color:white;font-weight:700;font-size:15px;display:block;width:100%;text-align:center;box-shadow:0 4px 12px rgba(8,145,178,.3)}
.btn-gray{background:var(--bg3);border:1px solid #334155;border-radius:14px;padding:14px;color:var(--text);font-size:14px;font-weight:600}
.btn-red{background:var(--bg3);border:1px solid #334155;border-radius:14px;padding:14px;color:var(--red);font-size:14px;font-weight:600}

/* 案4のミニマルデザイン */
.btn-minimal {
  width: 100%;
  padding: 20px 10px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--dim);
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  margin-bottom: 20px;
  transition: all 0.2s ease;
}
.btn-minimal .sub-text {
  font-size: 10px;
  color: var(--cyan);
  font-weight: 700;
  letter-spacing: 1px;
  display: block;
  margin-top: 4px;
}
.btn-minimal-done {
  width: 100%;
  padding: 20px 10px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--green);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  animation: fadeIn 0.5s ease;
}

.inp{width:100%;background:var(--bg3);border:1px solid #334155;border-radius:12px;padding:14px;color:var(--text);font-size:15px}
.tab-title{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:700;margin-bottom:4px}
.section-desc{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:12px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.week-cell-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px;font-weight:600}
.week-cell{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid transparent}
.week-cell.sober{background:var(--cyan);color:#020b18;font-weight:700}
.week-cell.drank{background:var(--red);color:white;font-weight:700}
.week-cell.today{border-color:var(--cyan);background:rgba(34,211,238,.05)}
.week-cell.empty{background:rgba(30,41,59,.5)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .2s ease-out}
.sheet{background:#0a1628;border-radius:24px 24px 0 0;padding:24px 24px calc(var(--safe-bot)+24px);width:100%;max-width:430px;border-top:1px solid var(--border);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
::-webkit-scrollbar{display:none}
.dog-svg-wrap{display:flex;justify-content:center;align-items:center;margin:8px 0 12px}
.dog-meter{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dog-pip{width:28px;height:6px;border-radius:3px;transition:background .4s}
.dog-pip.alive{background:var(--green)}.dog-pip.warned{background:var(--amber)}.dog-pip.dead{background:#374151}
.dog-pip.critical{background:var(--red);animation:pipPulse 1.8s ease-in-out infinite}
@keyframes pipPulse{0%,100%{opacity:1}50%{opacity:.3}}
#death-screen{position:fixed;inset:0;background:#000;z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column}
#death-screen.show{display:flex;animation:fadeIn .5s ease}

/* ── 誓約 / 破約 ── */
#vow-screen{position:fixed;inset:0;background:#000;z-index:600;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe-top) + 24px) 24px calc(var(--safe-bot) + 24px)}
#vow-screen.show{display:flex;animation:fadeIn .5s ease}
.vow-date{position:absolute;top:calc(var(--safe-top) + 26px);right:26px;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:'Noto Serif JP',serif;font-size:13px;line-height:1;color:#3a3a3a}
.vow-date span{display:block;opacity:0;transition:opacity .5s ease}
#vow-screen.in .vow-date span{opacity:1}
.vow-dog{opacity:0;transition:opacity .8s ease .6s;margin-bottom:26px}
#vow-screen.in .vow-dog{opacity:.55}
.vow-dog.sad{filter:grayscale(.55) brightness(.78)}
.vow-line{font-family:'Noto Serif JP',serif;font-size:22px;line-height:1.9;letter-spacing:.08em;color:#fff;opacity:0;transition:opacity .9s ease,color .8s ease}
.vow-line.dim{color:#555}
#vow-screen.in .vow-l1{opacity:1}
#vow-screen.in .vow-l2{opacity:1}
.vow-l1{transition:opacity .9s ease 1.2s,color .8s ease}
.vow-l2{transition:opacity .9s ease 1.9s,color .8s ease}
#vow-screen.sworn .vow-line{color:#7fd8e8}
.vow-act{opacity:0;transition:opacity .8s ease 2.8s;margin-top:38px;display:flex;flex-direction:column;align-items:center}
#vow-screen.in .vow-act{opacity:1}
.vow-hold{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-touch-callout:none;user-select:none}
.vow-hold svg{position:absolute;inset:0}
.vow-hint{font-family:'Noto Serif JP',serif;font-size:12px;color:#4b5563;letter-spacing:.2em;margin-top:14px}
.vow-quiet{font-size:11px;color:#333;letter-spacing:.1em;margin-top:44px;padding:10px;opacity:0;transition:opacity .8s ease 3.4s}
#vow-screen.in .vow-quiet{opacity:1}
.seal{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif JP',serif;font-size:30px;font-weight:700;color:#fff;background:#c0392b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.seal.broke{background:#7f2418;color:#e0bdb6}
.seal-pop{animation:sealPop .28s cubic-bezier(.2,1.4,.4,1) both}
.seal-late{animation:sealPop .28s cubic-bezier(.2,1.4,.4,1) 2.3s both,sealShake .45s 2.58s ease-in-out}
@keyframes sealPop{0%{transform:scale(1.7);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes sealShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.vow-after{opacity:0;transition:opacity .9s ease 3.1s;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
#vow-screen.in .vow-after{opacity:1}
.vow-msg{font-family:'Noto Serif JP',serif;font-size:18px;color:#fff;letter-spacing:.08em}
.vow-kept{font-size:12px;color:#555;letter-spacing:.05em}
.vow-note{font-size:11px;color:#333;line-height:1.8;margin-top:6px}
.vow-again{margin-top:20px;padding:14px 30px;border:1px solid #2a3a4a;border-radius:12px;font-family:'Noto Serif JP',serif;font-size:14px;color:#94a3b8;letter-spacing:.1em}

/* 誓約帯（ホーム常駐） */
.vow-band{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #1c2a3a;margin-bottom:20px;animation:fadeIn .5s ease}
.seal-mini{width:30px;height:30px;border-radius:50%;background:#c0392b;color:#fff;font-family:'Noto Serif JP',serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.seal-mini.broke{background:#4a1a12;color:#8d6a63}
.vow-band-title{font-family:'Noto Serif JP',serif;font-size:15px;color:var(--text);display:block}
.vow-band.broke .vow-band-title{color:#6b7280}
.vow-band-sub{font-size:10px;color:var(--dim);letter-spacing:.15em;display:block;margin-top:3px}

/* 破約した日の印 */
.broke-dot{position:relative}
.broke-dot::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.85)}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div style="display:flex;align-items:baseline;gap:8px">
      <span style="font-size:18px;font-weight:800;color:var(--cyan);letter-spacing:3px">節酒アプリ NAMO</span>
      <span style="font-size:11px;color:var(--dim);font-weight:600;letter-spacing:1px">Smart Moderation</span>
    </div>
  </div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nav-btn active" onclick="switchTab('home')" id="nav-home"><span class="ni">🏠</span><span class="nl">ホーム</span></button>
    <button class="nav-btn" onclick="switchTab('data')" id="nav-data"><span class="ni">📊</span><span class="nl">データ</span></button>
  </nav>
</div>
<div id="modal-container"></div>
<div id="death-screen"><div id="death-content" style="text-align:center;padding:40px 20px;max-width:320px"></div></div>
<div id="vow-screen"></div>

<script>
"use strict";
const WEEKLY_LIMIT = 4;
const WEEKLY_GOAL  = 2;

// 週の飲酒回数 → なもの状態。最終要素(index === WEEKLY_LIMIT)がゲームオーバー。
const DOG_STAGES = [
  { img:"dog0.png", w:110, h:130, name:"元気いっぱい",  color:"var(--green)" },
  { img:"dog1.png", w:110, h:130, name:"少し疲れた",    color:"var(--amber)" },
  { img:"dog3.png", w:110, h:130, name:"ぐったり",      color:"#f97316"      },
  { img:"dog4.png", w:160, h:110, name:"瀕死",          color:"var(--red)"   },
  { img:"dog5.jpg", w:160, h:110, name:"💀 今週終了",   color:"#6B7280"      }
];

const STATE_KEY = "wb_state_v3";
let state = {
  startDate:null, dailyCost:600, log:{},
  currentTab:"home", historyMonthOffset:0, bestStreak:0, bestWeeks:0
};

function localDateStr(date) {
  const d = date || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const todayKey = () => localDateStr(new Date());
function daysAgoKey(n) { const d = new Date(); d.setDate(d.getDate()-n); return localDateStr(d); }

let _gwCache = {v:0, h:""};
function goalWeeks() {
  const h = JSON.stringify(state.log);
  if (_gwCache.h === h) return _gwCache.v;
  let c = 0;
  for (let i = 0; i >= -52; i--) {
    const s = weekStats(getWeekDays(i));
    if (s.drank < WEEKLY_LIMIT && (s.sober + s.drank) >= 3) c++;
  }
  _gwCache = {v:c, h};
  return c;
}

function saveState() {
  try {
    const streak = calcStreak();
    if (streak > (state.bestStreak || 0)) state.bestStreak = streak;
    const gw = goalWeeks();
    if (gw > (state.bestWeeks || 0)) state.bestWeeks = gw;
    localStorage.setItem(STATE_KEY, JSON.stringify({
      startDate: state.startDate ? state.startDate.toISOString() : null,
      dailyCost: state.dailyCost, log: state.log,
      bestStreak: state.bestStreak, bestWeeks: state.bestWeeks
    }));
    _gwCache.h = "";
    scheduleAutoBackup();
  } catch(e) { console.warn("Save failed:", e); }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.startDate)  state.startDate  = new Date(d.startDate);
    if (d.dailyCost)  state.dailyCost  = Number(d.dailyCost);
    if (d.log)        state.log        = d.log;
    if (d.bestStreak) state.bestStreak = d.bestStreak;
    if (d.bestWeeks)  state.bestWeeks  = d.bestWeeks;
  } catch(e) { console.warn("Load failed:", e); }
}

let _bkTimer = null, _lastBk = 0;
function getGasUrl() { return localStorage.getItem("wb_gas_url") || ""; }

function scheduleAutoBackup() {
  if (_bkTimer) clearTimeout(_bkTimer);
  _bkTimer = setTimeout(function() {
    const url = getGasUrl(); if (!url) return;
    _lastBk = Date.now();
    const raw = localStorage.getItem(STATE_KEY); if (!raw) return;
    fetch(url, {method:"POST", headers:{"Content-Type":"text/plain"}, body:raw, redirect:"follow"})
      .then(r => r.text())
      .then(t => { try { const j = JSON.parse(t); if (j.success) localStorage.setItem("wb_last_bk", new Date().toISOString()); } catch(e) {} })
      .catch(() => {});
  }, Math.max(0, 30000 - (Date.now() - _lastBk)));
}

function manualBackup() {
  const url = getGasUrl();
  if (!url) { alert("GAS URLが未設定です。"); return; }
  const raw = localStorage.getItem(STATE_KEY);
  if (!raw) { alert("データがありません。"); return; }
  fetch(url, {method:"POST", headers:{"Content-Type":"text/plain"}, body:raw, redirect:"follow"})
    .then(r => r.text())
    .then(t => { const j = JSON.parse(t); alert(j.success ? "バックアップ完了！" : "失敗: " + (j.error || "")); if (j.success) localStorage.setItem("wb_last_bk", new Date().toISOString()); })
    .catch(e => { alert("通信エラー: " + e.message); });
}

function restoreFromSheets() {
  const url = getGasUrl();
  if (!url) { alert("GAS URLが未設定です。"); return; }
  if (!confirm("スプシから復元します。現在のデータは上書きされます。")) return;
  fetch(url, {redirect:"follow"}).then(r => r.text())
    .then(t => { const d = JSON.parse(t); if (!d.success) { alert("復元データなし"); return; } delete d.success; localStorage.setItem(STATE_KEY, JSON.stringify(d)); loadState(); closeModal(); renderContent(); alert("復元完了！"); })
    .catch(e => { alert("通信エラー: " + e.message); });
}

function forceUpdate() {
  if ("caches" in window) { caches.keys().then(n => { return Promise.all(n.map(k => caches.delete(k))); }).then(() => { location.reload(true); }); } else { location.reload(true); }
}

function getWeekDays(offset) {
  if (offset === undefined) offset = 0;
  const days = [], now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  mon.setDate(mon.getDate() - ((mon.getDay() + 6) % 7) + offset * 7);
  for (let i = 0; i < 7; i++) { const d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i); days.push(localDateStr(d)); }
  return days;
}

function weekStats(days) { return { drank: days.filter(d => state.log[d] === "drank").length, sober: days.filter(d => state.log[d] === "sober").length }; }
function calcStreak() {
  let streak = 0; const ts = state.log[todayKey()]; let start = (!ts) ? 1 : (ts === "drank") ? -1 : 0;
  if (start < 0) return 0;
  for (let i = start; i < 365; i++) { if (state.log[daysAgoKey(i)] === "sober") streak++; else break; }
  return streak;
}

function getWeekDrinks() { return getWeekDays(0).filter(d => state.log[d] === "drank").length; }
function isDead() { return getWeekDrinks() >= WEEKLY_LIMIT; }

function getDogStage() {
  const drankCount = getWeekDrinks();
  if (drankCount >= WEEKLY_LIMIT) return WEEKLY_LIMIT;
  const recovered =
    (state.log[todayKey()] === "sober" && state.log[daysAgoKey(1)] === "sober") ||
    (state.log[daysAgoKey(1)] === "sober" && state.log[daysAgoKey(2)] === "sober");
  return recovered ? Math.max(0, drankCount - 1) : drankCount;
}

function getDogSVG(stage) {
  const s = DOG_STAGES[stage] || DOG_STAGES[0];
  return '<img src="' + s.img + '" width="' + s.w + '" height="' + s.h + '" style="object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4))" alt="なも stage ' + stage + '" onerror="this.src=\'https://placehold.co/' + s.w + 'x' + s.h + '/1e293b/f1f5f9?text=' + s.img + '\'">';
}

function getCumulativeStats() {
  const sober = Object.values(state.log).filter(v => v === "sober").length;
  const drank = Object.values(state.log).filter(v => v === "drank").length;
  let daysSinceStart = 0;
  
  if (state.startDate) {
    const today = new Date(todayKey());
    const start = new Date(localDateStr(state.startDate));
    daysSinceStart = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
  } else {
    const logKeys = Object.keys(state.log).sort();
    if (logKeys.length > 0) {
      const today = new Date(todayKey());
      const start = new Date(logKeys[0]);
      daysSinceStart = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
    }
  }
  
  const totalLogs = sober + drank;
  const soberRate = totalLogs > 0 ? Math.round((sober / totalLogs) * 100) : 0;
  return { sober, drank, daysSinceStart, soberRate };
}

function openModal(type, extra) {
  if (extra === undefined) extra = null;
  const mc = document.getElementById("modal-container");
  let content = "";

  if (type === "setup") {
    const dv = state.startDate ? localDateStr(state.startDate) : todayKey();
    content = '<h3 class="tab-title">⚙️ セットアップ</h3><p class="section-desc">基本情報を設定してください。</p><div class="col"><div><label class="label-sm">開始日</label><input type="date" id="setup-date" class="inp" value="' + dv + '"></div><div><label class="label-sm">1日の酒代（平均）</label><input type="number" id="setup-cost" class="inp" value="' + state.dailyCost + '"></div><button class="btn-cyan" onclick="saveSetup()">保存する</button></div>';
  } else if (type === "recovery") {
    content = '<h3 class="tab-title">📝 飲酒の記録</h3><p class="section-desc">飲んでしまった日として記録します。</p><div class="col"><button style="background:var(--red);color:white;border-radius:14px;padding:14px;font-weight:700;font-size:15px;width:100%" onclick="logToday(\'drank\')">記録を保存</button></div>';
  } else if (type === "edit-log") {
    const k = extra, val = state.log[k];
    const sb = val === "sober" ? "border:2px solid white" : "";
    const db = val === "drank" ? "border:2px solid white" : "";

function updateLog(date, val) {

  // 誤タップの取り消しなら、その日の誓約を元に戻す
  if (val !== "drank") {
    const b = getBrokeAt(date);

function logToday(val) {
  const k = todayKey();
  const committedAt = (val === "drank") ? getCommittedAt(k) : null;
  state.log[k] = val;
  if (val === "drank") {
    localStorage.removeItem("wb_commit_" + k);
    if (committedAt) localStorage.setItem("wb_broke_" + k, committedAt);
  }
  saveState(); closeModal(); renderContent();

/* ───────── 誓約 / 破約 ───────── */
const KANJI = "〇一二三四五六七八九";
function kanjiYear(n) { return String(n).split("").map(c => KANJI[Number(c)]).join(""); }
function kanjiCount(n) {
  if (n < 10) return KANJI[n];
  if (n === 10) return "十";
  if (n < 20) return "十" + KANJI[n - 10];
  const t = Math.floor(n / 10), r = n % 10;
  return KANJI[t] + "十" + (r ? KANJI[r] : "");
}
function kanjiDate(d) { return kanjiYear(d.getFullYear()) + "年" + kanjiCount(d.getMonth() + 1) + "月" + kanjiCount(d.getDate()) + "日"; }
function kanjiDateHtml(d) {
  return kanjiDate(d).split("").map((c, i) => '<span style="transition-delay:' + (400 + i * 55) + 'ms">' + c + '</span>').join("");
}

function getCommittedAt(k) { return localStorage.getItem("wb_commit_" + k); }
function getBrokeAt(k) { return localStorage.getItem("wb_broke_" + k); }
function keptText(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return "";
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "";
  return m < 60 ? ("約束から " + m + "分 守れました") : ("約束から " + Math.floor(m / 60) + "時間 守れました");
}

const VOW_HOLD = 2500, RING_LEN = 213.6;
let _vowTimer = null, _vowDone = false, _pendingDeath = false;

function vowScreenOpen(html) {
  const el = document.getElementById("vow-screen");
  el.className = "";
  el.innerHTML = html;
  el.classList.add("show");
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
}
function vowScreenClose() {
  const el = document.getElementById("vow-screen");
  el.className = "";
  el.innerHTML = "";
}

function openVow() {
  _vowDone = false;
  _vowTimer = null;
  vowScreenOpen(
    '<div class="vow-date">' + kanjiDateHtml(new Date()) + '</div>'
    + '<img class="vow-dog" src="dog0.png" width="90" height="106" style="object-fit:contain" alt="なも">'
    + '<p class="vow-line vow-l1">私は今日、酒を飲まない。</p>'
    + '<p class="vow-line vow-l2">なもと約束する。</p>'
    + '<div class="vow-act" id="vow-act">'
    +   '<div class="vow-hold" id="vow-hold" oncontextmenu="return false">'
    +     '<svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">'
    +       '<circle cx="44" cy="44" r="34" fill="none" stroke="#132234" stroke-width="2"></circle>'
    +       '<circle id="vow-ring" cx="44" cy="44" r="34" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 44 44)" stroke-dasharray="' + RING_LEN + '" stroke-dashoffset="' + RING_LEN + '"></circle>'
    +     '</svg>'
    +   '</div>'
    +   '<p class="vow-hint" id="vow-hint">押し続けて誓う</p>'
    + '</div>'
    + '<button class="vow-quiet" onclick="vowScreenClose()">まだ決めない</button>'
  );
  const hold = document.getElementById("vow-hold");
  hold.addEventListener("pointerdown", vowPressStart);
  hold.addEventListener("pointerup", vowPressEnd);
  hold.addEventListener("pointercancel", vowPressEnd);
  hold.addEventListener("pointerleave", vowPressEnd);
}

function vowPressStart(e) {
  if (_vowDone) return;
  if (e && e.preventDefault) e.preventDefault();
  const r = document.getElementById("vow-ring");
  if (!r) return;
  r.style.transition = "stroke-dashoffset " + VOW_HOLD + "ms linear";
  r.style.strokeDashoffset = "0";
  _vowTimer = setTimeout(vowComplete, VOW_HOLD);
}
function vowPressEnd() {
  if (_vowDone) return;
  if (_vowTimer) { clearTimeout(_vowTimer); _vowTimer = null; }
  const r = document.getElementById("vow-ring");
  if (!r) return;
  r.style.transition = "stroke-dashoffset 300ms ease-out";
  r.style.strokeDashoffset = String(RING_LEN);
}
function vowComplete() {
  _vowDone = true;
  _vowTimer = null;
  localStorage.setItem("wb_commit_" + todayKey(), new Date().toISOString());
  try { if (navigator.vibrate) navigator.vibrate([40, 60, 140]); } catch (e) {}
  const el = document.getElementById("vow-screen");
  const act = document.getElementById("vow-act");
  if (act) act.innerHTML = '<div class="seal seal-pop">誓</div><p class="vow-hint">誓いました</p>';
  if (el) el.classList.add("sworn");
  setTimeout(function() { vowScreenClose(); renderContent(); }, 1800);
}

function openBroken(committedAt, alsoDead) {
  _pendingDeath = !!alsoDead;
  const kept = keptText(committedAt);
  vowScreenOpen(
    '<div class="vow-date">' + kanjiDateHtml(new Date()) + '</div>'
    + '<img class="vow-dog sad" src="dog2.png" width="90" height="106" style="object-fit:contain" alt="なも">'
    + '<p class="vow-line dim vow-l1">私は今日、酒を飲まない。</p>'
    + '<p class="vow-line dim vow-l2">なもと約束する。</p>'
    + '<div style="margin-top:34px"><div class="seal broke seal-late">破</div></div>'
    + '<div class="vow-after">'
    +   '<p class="vow-msg">なもは、なにも言わない。</p>'
    +   (kept ? '<p class="vow-kept">' + kept + '</p>' : '')
    +   '<p class="vow-note">記録できたあなたは、逃げなかった。</p>'
    +   '<button class="vow-again" onclick="closeBroken()">明日、また約束する</button>'
    + '</div>'
  );
  setTimeout(function() { try { if (navigator.vibrate) navigator.vibrate(320); } catch (e) {} }, 2300);
}
function closeBroken() {
  vowScreenClose();
  if (_pendingDeath) { _pendingDeath = false; showDeathScreen(); }
}
function showDeathScreen() {
  const ds = document.getElementById("death-screen"), dc = document.getElementById("death-content");

  const cells = []; for (let i = 0; i < fd; i++) cells.push(null); for (let d = 1; d <= ld; d++) cells.push(d);
  const dh = ["月","火","水","木","金","土","日"];
  let grid = "";
  dh.forEach(d => { grid += '<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding-bottom:8px">' + d + '</div>'; });

    if (!dd) { grid += '<div style="aspect-ratio:1"></div>'; return; }

  });

    + '</div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">'
    + '<div style="background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.2);border-radius:16px;padding:12px;text-align:center;">'
    + '<p style="font-size:10px;color:var(--green);font-weight:700;margin-bottom:4px;">累計休肝日</p>'

let _swipeX = null;
document.addEventListener("touchstart", e => { if (state.currentTab === "data") _swipeX = e.touches[0].clientX; }, {passive:true});
document.addEventListener("touchend", e => { if (state.currentTab !== "data" || _swipeX === null) return; const dx = e.changedTouches[0].clientX - _swipeX; _swipeX = null; if (Math.abs(dx) > 60) changeMonth(dx < 0 ? -1 : 1); }, {passive:true});

let _lastVis = Date.now();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { const now = Date.now(); if (now - _lastVis > 60000) { renderContent(); } _lastVis = now; } });

window._mainScriptLoaded = true;
document.addEventListener("DOMContentLoaded", function() {
  try { loadState(); } catch(e) { console.error(e); }
  try { renderContent(); } catch(e) { console.error(e); }
});
</script>
